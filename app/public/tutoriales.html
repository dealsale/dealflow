<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icon-192.png">
</head>
<body>
<title>Tutoriales DealFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: riel de tutoriales a la izquierda + escenario con el panel simulado y la guía paso a paso. */
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #EEF2F7;
  --line: #DDE3EC;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #64748B;
  --brand: #059669;
  --brand-ink: #047857;
  --brand-soft: #D1FAE5;
  --accent: #6D5DF6;
  --accent-soft: #ECEAFE;
  --halo: rgba(5, 150, 105, .55);
  --shadow: 0 10px 30px -14px rgba(15, 23, 42, .35);
  --f-ui: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-titulo: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0F1C; --surface: #121A2E; --surface-2: #19223A; --line: #26314D; --ink: #F1F5FF; --ink-2: #CBD5E8; --muted: #8E9BB8;
    --brand: #1FD8A8; --brand-ink: #4DF0C4; --brand-soft: rgba(31, 216, 168, .14); --accent: #A49BFF; --accent-soft: rgba(164, 155, 255, .14);
    --halo: rgba(31, 216, 168, .6); --shadow: 0 12px 34px -14px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0F1C; --surface: #121A2E; --surface-2: #19223A; --line: #26314D; --ink: #F1F5FF; --ink-2: #CBD5E8; --muted: #8E9BB8;
  --brand: #1FD8A8; --brand-ink: #4DF0C4; --brand-soft: rgba(31, 216, 168, .14); --accent: #A49BFF; --accent-soft: rgba(164, 155, 255, .14);
  --halo: rgba(31, 216, 168, .6); --shadow: 0 12px 34px -14px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.marca i { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #10B981, #2563EB); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 15px; }
.marca small { font-weight: 600; color: var(--muted); font-size: 13px; }
.top .esp { flex: 1; }
.volver { color: var(--brand-ink); font-weight: 700; text-decoration: none; font-size: 13px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; background: var(--surface); }
.avance-global { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.riel { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px 30px; overflow-y: auto; }
.riel h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 10px 6px; }
.riel h3:first-child { margin-top: 4px; }
.tuto-btn { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; color: var(--ink); }
.tuto-btn:hover { background: var(--surface-2); }
.tuto-btn[aria-current="true"] { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 40%, transparent); }
.tuto-btn .ic { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; background: var(--surface-2); font-size: 14px; }
.tuto-btn b { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.tuto-btn span.m { font-size: 11.5px; color: var(--muted); }
.tuto-btn .ok { margin-left: auto; color: var(--brand); font-weight: 800; font-size: 13px; }

.zona { padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.zona-in { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.cabeza { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; }
.cabeza .eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
.cabeza h1 { font-family: var(--f-titulo); margin: 2px 0 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.cabeza p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.cabeza .esp { flex: 1; }
.pasos-mini { display: flex; gap: 5px; align-items: center; }
.pasos-mini i { width: 22px; height: 6px; border-radius: 4px; background: var(--line); }
.pasos-mini i.hecho { background: var(--brand); }
.pasos-mini i.ahora { background: var(--accent); }

.guia { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); flex-wrap: wrap; }
.guia .num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.guia .txt { flex: 1 1 320px; min-width: 0; }
.guia .txt > b { display: block; font-size: 15px; }
.guia .txt span b { color: var(--ink); }
.guia .txt span { color: var(--ink-2); font-size: 13.5px; }
.guia .hint { font-size: 12px; color: var(--muted); }
.btn { border-radius: 9px; padding: 9px 15px; font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn.pri { color: #04231A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.pri { color: #04231A; } }
.btn:disabled { opacity: .45; cursor: default; }

/* Escenario: el panel simulado se dibuja a 1180×720 y se escala al ancho disponible. */
.escenario { position: relative; width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #F8FAFC; }
.lienzo { position: absolute; top: 0; left: 0; width: 1180px; height: 720px; transform-origin: 0 0; }
.foco { position: absolute; border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 3px #10B981, 0 0 0 9999px rgba(15, 23, 42, .42); transition: all .35s cubic-bezier(.2, .8, .2, 1); z-index: 40; }
.foco::after { content: ''; position: absolute; inset: -8px; border-radius: 14px; border: 2px solid #10B981; animation: pulso 1.6s ease-out infinite; }
@keyframes pulso { from { opacity: .9; transform: scale(.96); } to { opacity: 0; transform: scale(1.12); } }
.burbuja { position: absolute; z-index: 41; width: 280px; background: #0F172A; color: #F8FAFC; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .55); transition: all .35s cubic-bezier(.2, .8, .2, 1); }
.burbuja b { color: #6EE7B7; }
.burbuja .mano { display: block; margin-top: 6px; font-size: 12px; color: #A7B4CC; }
.final { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(15, 23, 42, .55); }
.final .caja { background: #fff; color: #0F172A; border-radius: 18px; padding: 30px 34px; width: 520px; text-align: center; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); }
.final .caja .sello { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; background: #D1FAE5; color: #047857; display: grid; place-items: center; font-size: 30px; }
.final .caja h2 { font-family: var(--f-titulo); margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
.final .caja p { margin: 0 0 16px; color: #475569; font-size: 15px; }
.final .caja ul { text-align: left; margin: 0 0 20px; padding-left: 20px; color: #334155; font-size: 14px; }
.final .caja .fila { display: flex; gap: 10px; justify-content: center; }
.final .caja button { border-radius: 10px; padding: 11px 18px; font-weight: 700; font-size: 14px; cursor: pointer; border: 1px solid #CBD5E1; background: #fff; color: #0F172A; }
.final .caja button.pri { background: #059669; border-color: #059669; color: #fff; }

/* ───── Panel simulado (siempre el tema claro de DealFlow) ───── */
.df { position: absolute; inset: 0; display: flex; font-family: var(--f-ui); color: #0F172A; background: #F8FAFC; font-size: 14px; }
.df-side { width: 220px; background: #0F172A; color: #CBD5E1; padding: 18px 12px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.df-logo { display: flex; align-items: center; gap: 9px; color: #fff; font-weight: 800; font-size: 17px; margin: 0 6px 16px; }
.df-logo i { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #10B981, #2563EB); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.df-nav { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px; font-size: 14px; color: #94A3B8; }
.df-nav.on { background: #065F46; color: #fff; font-weight: 700; }
.df-nav .badge { margin-left: auto; background: #F59E0B; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 800; padding: 0 7px; }
.df-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.df-head { height: 56px; background: #fff; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 12px; padding: 0 24px; flex-shrink: 0; }
.df-head .tienda { font-weight: 800; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.ok { background: #D1FAE5; color: #047857; }
.pill.no { background: #FEE2E2; color: #B91C1C; }
.df-head .esp { flex: 1; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #059669; color: #fff; font-weight: 800; display: grid; place-items: center; }
.perfil { display: flex; align-items: center; gap: 9px; padding: 4px 8px; border-radius: 10px; }
.perfil b { display: block; font-size: 13px; }
.perfil small { color: #64748B; font-size: 11.5px; }
.df-body { flex: 1; overflow: hidden; padding: 22px 26px; position: relative; }
.h1 { font-family: var(--f-titulo); font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.sub { color: #64748B; font-size: 13.5px; margin: 3px 0 0; }
.fila { display: flex; align-items: center; gap: 10px; }
.esp { flex: 1; }
.b { border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 13px; border: 1px solid #E2E8F0; background: #fff; color: #0F172A; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.b.v { background: #059669; border-color: #059669; color: #fff; }
.b.m { background: #6D28D9; border-color: #6D28D9; color: #fff; }
.b.n { background: #C2410C; border-color: #C2410C; color: #fff; }
.card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; }
.inp { border: 1px solid #CBD5E1; border-radius: 8px; padding: 8px 10px; font-size: 13px; background: #fff; color: #0F172A; min-height: 36px; display: flex; align-items: center; }
.inp.ph { color: #94A3B8; }
.lbl { font-size: 11.5px; font-weight: 700; color: #64748B; margin-bottom: 4px; }
.th { font-size: 11px; font-weight: 800; color: #64748B; letter-spacing: .05em; text-transform: uppercase; }
.mono { font-family: var(--f-mono); }
.chip { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; }
.e-nuevo { background: #DBEAFE; color: #1D4ED8; } .e-conf { background: #EDE9FE; color: #6D28D9; } .e-guia { background: #FEF3C7; color: #B45309; }
.e-trans { background: #CFFAFE; color: #0E7490; } .e-rep { background: #DBEAFE; color: #1D4ED8; } .e-nov { background: #FFEDD5; color: #C2410C; } .e-ent { background: #D1FAE5; color: #047857; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 430px; background: #fff; border-left: 1px solid #E2E8F0; box-shadow: -18px 0 40px -20px rgba(15, 23, 42, .35); display: flex; flex-direction: column; z-index: 5; }
.drawer .dh { padding: 14px 18px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px; }
.drawer .db { padding: 12px 18px; overflow: hidden; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.drawer .df2 { padding: 12px 18px; border-top: 1px solid #E2E8F0; display: flex; gap: 8px; align-items: center; }
.velo { position: absolute; inset: 0; background: rgba(15, 23, 42, .25); z-index: 4; }
.modal { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; background: #fff; border-radius: 16px; box-shadow: 0 30px 60px -20px rgba(15, 23, 42, .45); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tog { width: 36px; height: 20px; border-radius: 999px; background: #CBD5E1; position: relative; flex-shrink: 0; }
.tog::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
.tog.on { background: #059669; } .tog.on::after { left: 18px; }
.burb { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; }
.burb.c { background: #fff; border: 1px solid #E2E8F0; align-self: flex-start; }
.burb.y { background: #D1FAE5; align-self: flex-end; }
.burb.v { background: #EDE9FE; align-self: flex-end; }
.tipeando::after { content: '|'; animation: blink 1s steps(1) infinite; color: #059669; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .riel { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; }
  .riel h3 { display: none; }
  .tuto-btn { width: auto; flex-shrink: 0; }
  .tuto-btn span.m { display: none; }
  .burbuja { display: none; }
}
@media (prefers-reduced-motion: reduce) { .foco, .burbuja { transition: none; } .foco::after, .tipeando::after { animation: none; } }
</style>

<header class="top">
  <div class="marca"><i>✦</i> DealFlow <small>Tutoriales</small></div>
  <div class="esp"></div>
  <span class="avance-global" id="avanceGlobal"></span>
  <a class="volver" id="volver" href="/" hidden>← Volver al panel</a>
</header>

<div class="app">
  <nav class="riel" id="riel" aria-label="Tutoriales"></nav>
  <main class="zona">
    <div class="zona-in">
      <div class="cabeza">
        <div>
          <div class="eyebrow" id="grupo"></div>
          <h1 id="titulo"></h1>
          <p id="resumen"></p>
        </div>
        <div class="esp"></div>
        <div class="pasos-mini" id="pasosMini" aria-hidden="true"></div>
      </div>
      <div class="guia" aria-live="polite">
        <div class="num" id="num">1</div>
        <div class="txt"><b id="pasoTitulo"></b><span id="pasoTexto"></span><div class="hint" id="pasoHint"></div></div>
        <button class="btn" id="ant" type="button">← Anterior</button>
        <button class="btn pri" id="sig" type="button">Siguiente →</button>
      </div>
      <div class="escenario" id="escenario">
        <div class="lienzo" id="lienzo"></div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  // ───────── Piezas del panel simulado ─────────
  const NAV = [['resumen', '▦', 'Resumen'], ['productos', '◇', 'Productos'], ['asistente', '☺', 'Asistente'], ['whatsapp', '◌', 'WhatsApp'], ['pedidos', '▣', 'Pedidos'], ['leads', '☷', 'Leads'], ['inbox', '✉', 'Inbox'], ['integraciones', '⚡', 'Integraciones'], ['tutoriales', '🎓', 'Tutoriales']];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const campo = (t, lbl, val, ph) => `<div><div class="lbl">${lbl}</div><div class="inp ${val ? '' : 'ph'}" data-t="${t}">${val ? esc(val) : esc(ph || '')}</div></div>`;
  const tog = (on, t) => `<span class="tog ${on ? 'on' : ''}" ${t ? `data-t="${t}"` : ''}></span>`;

  function shell(sec, cuerpo, st) {
    const nav = NAV.map(([id, ic, l]) => `<div class="df-nav ${id === sec ? 'on' : ''}" data-t="nav-${id}"><span>${ic}</span>${l}${id === 'pedidos' && st.novedad ? '<span class="badge">1</span>' : ''}</div>`).join('');
    const wa = st.waConectado === false ? '<span class="pill no">● WhatsApp desconectado</span>' : '<span class="pill ok">● WhatsApp conectado</span>';
    return `<div class="df">
      <aside class="df-side"><div class="df-logo"><i>✦</i>DealFlow</div>${nav}</aside>
      <div class="df-main">
        <div class="df-head"><span class="tienda">Luna Accesorios ▾</span>${wa}<span class="esp"></span>
          <div class="perfil" data-t="perfil"><span class="avatar">K</span><div><b>Karla</b><small>${st.en ? 'Store owner' : 'Dueña de la tienda'}</small></div><span style="color:#94A3B8">▾</span></div></div>
        <div class="df-body">${cuerpo}</div>
      </div></div>`;
  }

  const PEDIDOS = [
    { n: 'DF-1131', c: 'Ana Martínez', ci: 'Pore · Casanare', p: '1× Vestido Layla (Talla M · Azul rey)', t: '$129.900', tr: 'Interrapidísimo', g: '240063774164', e: ['Guía generada', 'e-guia'] },
    { n: 'DF-1130', c: 'Sofía Ramírez', ci: 'Cali · Valle', p: '3× Jogger jaspeado', t: '$146.700', tr: 'Servientrega', g: '99887766', e: ['Novedad', 'e-nov'] },
    { n: 'DF-1129', c: 'María Bermúdez', ci: 'Villavicencio · Meta', p: '1× Vestido Layla (Talla L · Azul rey)', t: '$129.900', tr: 'Envía', g: '014164737678', e: ['En tránsito', 'e-trans'] },
    { n: 'DF-1128', c: 'Georgina Marriaga', ci: 'Barranquilla · Atlántico', p: '2× Vestido Layla (Talla 2XL)', t: '$259.900', tr: 'Envía', g: '014164738853', e: ['En reparto', 'e-rep'] },
    { n: 'DF-1127', c: 'María Castro', ci: 'Cali · Valle', p: '1× Vestido Layla (Talla M · Blanco)', t: '$129.900', tr: 'Envía', g: '014164737464', e: ['Entregado', 'e-ent'] },
  ];

  function vPedidos(st) {
    const nuevo = st.pedidoCreado ? [{ n: 'DF-1132', c: 'Laura Gómez', ci: 'Medellín · Antioquia', p: '1× Vestido Layla (Talla S · Negro)', t: '$129.900', tr: '', g: '', e: [st.pedEstado || 'Nuevo', st.pedEstado === 'Confirmado' ? 'e-conf' : 'e-nuevo'] }] : [];
    const filas = [...nuevo, ...PEDIDOS].filter((o) => !st.filtroGuia || o.g).map((o) => `
      <div data-t="row-${o.n}" style="display:grid;grid-template-columns:120px 1.2fr 1.5fr 92px 1.2fr 128px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid #E2E8F0">
        <div><div class="mono" style="font-weight:700;font-size:12.5px">${o.n}</div><div style="font-size:11px;color:#64748B">Hoy · 09:4${o.n.slice(-1)}</div></div>
        <div><div style="font-weight:700">${o.c}</div><div style="font-size:11.5px;color:#64748B">${o.ci}</div></div>
        <div style="font-size:12.5px;color:#334155">${o.p}</div>
        <div style="font-weight:800;text-align:right">${o.t}</div>
        <div style="font-size:12px">${o.g ? `<span class="chip" style="background:#EDE9FE;color:#6D28D9;font-size:10.5px">Effi</span> <b>${o.tr}</b><div class="mono" style="font-size:11px;color:#475569;margin-top:2px">${o.g}</div>` : '<span style="color:#94A3B8">Sin despachar</span>'}</div>

      pasos: [
        { vista: 'pedidos', t: 'ped-filtros', titulo: 'Abre los filtros', texto: 'Toca <b>Filtros</b>.' },
        { vista: 'pedidos', set: { filtrosAbiertos: true }, t: 'f-guia', titulo: 'Con guía', texto: 'Filtra por estado, por guía, ciudad o producto. Toca <b>Con guía</b>.' },
        { vista: 'pedidos', set: { filtroGuia: true }, t: 'ped-export', titulo: 'Exporta', texto: '<b>Exportar</b> descarga en Excel justo los pedidos que estás viendo.' },
        { vista: 'pedidos', fin: ['Los filtros se combinan entre sí.', 'El Excel sale con los pedidos filtrados.'] },
      ] },
    { id: 'idioma', grupo: 'Cuenta y reportes', ic: '🌐', titulo: 'Panel en inglés', min: 1, resumen: 'Cambia el idioma del panel y el del asistente.',
      pasos: [
        { vista: 'resumen', t: 'perfil', titulo: 'Tu perfil', texto: 'Arriba a la derecha toca tu nombre.' },
        { vista: 'resumen', set: { perfilMenu: true }, t: 'idioma-en', titulo: 'Idioma', texto: 'Elige <b>EN</b>: todo el panel pasa a inglés al instante.' },
        { vista: 'resumen', set: { perfilMenu: false, en: true }, t: 'nav-asistente', titulo: 'Y el asistente', texto: 'El idioma del asistente es aparte: en Asistente → Personalidad eliges Español, Inglés o <b>Automático</b> (responde en el idioma del cliente).' },
        { vista: 'asistente', set: { asisIdioma: 'Automático (el del cliente)' }, fin: ['El panel cambia solo para ti.', 'El asistente puede responder en el idioma de cada cliente.'] },
      ] },
  ];

  // Si el último paso tiene objetivo y resumen, el resumen va en una pantalla final aparte.
  T.forEach((t) => {
    const u = t.pasos[t.pasos.length - 1];
    if (u.t && u.fin) { t.pasos.push({ vista: u.vista, fin: u.fin }); delete u.fin; }
  });

  // ───────── Motor ─────────
  const $ = (id) => document.getElementById(id);
  const lienzo = $('lienzo'); const escenario = $('escenario');
  let ti = 0; let pi = 0; let escala = 1;
  const hechos = new Set();
  try { (JSON.parse(localStorage.getItem('df-tutos') || '[]') || []).forEach((x) => hechos.add(x)); } catch (e) { /* sin almacenamiento */ }
  const guardarHechos = () => { try { localStorage.setItem('df-tutos', JSON.stringify([...hechos])); } catch (e) { /* nada */ } };

  if (/^\/tutoriales/.test(location.pathname)) $('volver').hidden = false;

  function pintarRiel() {
    let html = ''; let g = '';
    T.forEach((t, i) => {
      if (t.grupo !== g) { g = t.grupo; html += `<h3>${g}</h3>`; }
      html += `<button class="tuto-btn" type="button" data-i="${i}" aria-current="${i === ti}"><span class="ic">${t.ic}</span><span><b>${t.titulo}</b><span class="m">${t.min} min · ${t.pasos.filter((x) => x.t).length} pasos</span></span>${hechos.has(t.id) ? '<span class="ok">✓</span>' : ''}</button>`;
    });
    $('riel').innerHTML = html;
    $('avanceGlobal').textContent = `${hechos.size} de ${T.length} completados`;
  }

  function estadoEn(t, n) {
    const st = { ...(t.base || {}) };
    for (let k = 0; k <= n; k++) Object.assign(st, t.pasos[k].set || {});
    return st;
  }

  function medir() {
    const w = escenario.clientWidth;
    escala = Math.min(1, w / 1180);
    lienzo.style.transform = `scale(${escala})`;
    escenario.style.height = `${720 * escala}px`;
  }

  function pintar() {
    const t = T[ti]; const p = t.pasos[pi]; const st = estadoEn(t, pi);
    $('grupo').textContent = t.grupo;
    $('titulo').textContent = t.titulo;
    $('resumen').textContent = t.resumen;
    const conObjetivo = t.pasos.filter((x) => x.t).length;
    $('pasosMini').innerHTML = t.pasos.filter((x) => x.t).map((_, k) => `<i class="${k < pi ? 'hecho' : k === pi ? 'ahora' : ''}"></i>`).join('');
    const esFinal = !p.t && p.fin;
    $('num').textContent = esFinal ? '✓' : String(pi + 1);
    $('pasoTitulo').textContent = esFinal ? '¡Tutorial completado!' : p.titulo;
    $('pasoTexto').innerHTML = esFinal ? 'Repasa lo que aprendiste o sigue con el próximo tutorial.' : p.texto;
    $('pasoHint').textContent = esFinal ? '' : `Paso ${pi + 1} de ${conObjetivo} · haz clic en lo resaltado o usa "Siguiente"`;
    $('ant').disabled = pi === 0;
    $('sig').textContent = esFinal ? (ti < T.length - 1 ? 'Próximo tutorial →' : 'Volver al inicio') : 'Siguiente →';

    lienzo.innerHTML = shell(SECCION[p.vista], VISTAS[p.vista](st), st) + '<div class="foco" id="foco" hidden></div><div class="burbuja" id="burbuja" hidden></div>';
    if (esFinal) {
      hechos.add(t.id); guardarHechos(); pintarRiel();
      const sig = T[ti + 1];
      lienzo.insertAdjacentHTML('beforeend', `<div class="final"><div class="caja"><div class="sello">✓</div><h2>${t.titulo}: listo</h2><p>Esto es lo que ya sabes hacer:</p><ul>${p.fin.map((x) => `<li>${x}</li>`).join('')}</ul><div class="fila"><button type="button" id="repetir">Repetir</button>${sig ? `<button type="button" class="pri" id="proximo">Siguiente: ${sig.titulo} →</button>` : ''}</div></div></div>`);
      $('repetir').onclick = () => irA(ti, 0);
      if (sig) $('proximo').onclick = () => irA(ti + 1, 0);
      return;
    }
    requestAnimationFrame(() => enfocar(p));
  }

  function enfocar(p) {
    const el = lienzo.querySelector(`[data-t="${p.t}"]`);
    const foco = $('foco'); const burbuja = $('burbuja');
    if (!el) return;
    const base = lienzo.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const x = (r.left - base.left) / escala; const y = (r.top - base.top) / escala;
    const w = r.width / escala; const h = r.height / escala;
    Object.assign(foco.style, { left: `${x - 4}px`, top: `${y - 4}px`, width: `${w + 8}px`, height: `${h + 8}px` });
    foco.hidden = false;
    burbuja.innerHTML = `${p.texto}<span class="mano">👆 Haz clic aquí</span>`;
    burbuja.hidden = false;
    // La burbuja va abajo del objetivo; si no cabe, arriba; y se mantiene dentro del lienzo.
    const bw = 280; const bh = burbuja.offsetHeight || 110;
    let bx = Math.min(Math.max(12, x + w / 2 - bw / 2), 1180 - bw - 12);
    let by = y + h + 16;
    if (by + bh > 708) by = Math.max(12, y - bh - 16);
    Object.assign(burbuja.style, { left: `${bx}px`, top: `${by}px` });
    el.style.cursor = 'pointer';
  }

  function irA(t, p) { ti = t; pi = p; pintarRiel(); pintar(); try { history.replaceState(null, '', `#${T[ti].id}`); } catch (e) { /* nada */ } }
  function siguiente() {
    const t = T[ti];
    if (pi < t.pasos.length - 1) { pi++; pintar(); return; }
    irA(ti < T.length - 1 ? ti + 1 : 0, 0);
  }

  lienzo.addEventListener('click', (e) => {
    const p = T[ti].pasos[pi];
    if (!p.t) return;
    const el = e.target.closest('[data-t]');
    if (el && el.getAttribute('data-t') === p.t) siguiente();
  });
  $('sig').onclick = siguiente;
  $('ant').onclick = () => { if (pi > 0) { pi--; pintar(); } };
  $('riel').addEventListener('click', (e) => { const b = e.target.closest('.tuto-btn'); if (b) irA(Number(b.dataset.i), 0); });
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') siguiente(); if (e.key === 'ArrowLeft' && pi > 0) { pi--; pintar(); } });
  window.addEventListener('resize', () => { medir(); const p = T[ti].pasos[pi]; if (p.t) enfocar(p); });

  const inicial = T.findIndex((t) => t.id === location.hash.slice(1));
  ti = inicial >= 0 ? inicial : 0;
  medir(); pintarRiel(); pintar();
})();
</script>

</body>
</html>
